name: Deploy React to GitHub Pages

on:
  push:
    branches: [react]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout react branch
        uses: actions/checkout@v4
        with:
          ref: react

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: react-dist
          path: dist

      - name: Remove old react folder
        run: rm -rf react

      - name: Copy dist to react subfolder
        run: cp -r dist react

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit changes
        run: |
          git add react
          git commit -m "Deploy React app" || echo "No changes to commit"

      - name: Push to main
        run: git push
