name: Deploy React to GitHub Pages

on:
  push:
    branches: [react]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout react branch
        uses: actions/checkout@v4
        with:
          ref: react

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Deploy to react subfolder
        run: |
          cd main-repo
          rm -rf react
          cp -r ../dist react
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add react
          git commit -m "Deploy React app" || echo "No changes to commit"
          git push
