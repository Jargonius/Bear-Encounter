name: Deploy React to GitHub Pages

on:
  push:
    branches: [react]

permissions:
  contents: write
  pages: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-repo

      - name: Deploy to react subfolder
        run: |
          cd gh-pages-repo
          rm -rf react
          cp -r ../dist react
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add react
          git commit -m "Deploy React app from react branch" || echo "No changes to commit"
          git push
